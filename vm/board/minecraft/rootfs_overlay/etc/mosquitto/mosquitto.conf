# Mosquitto 2.x — MQTT v5 for Nautilus Craft.
#
# Loopback listener: the Rust bridge (minecraft-server) persists map edits,
# publishes NPC state and writes the level anchors.
# Websocket listener: nginx proxies /mqtt here; the browser game uses MQTT v5.
#
# Anonymous access is a LAN/demo decision. The VM is a disposable game guest;
# put a password file and TLS in front of this before exposing it.
pid_file /var/run/mosquitto.pid
# The guest init starts this as root; the game is a LAN demo and Mosquitto must
# be able to write its pid into /var/run.
user root
persistence false
allow_anonymous true
max_queued_messages 4096
message_size_limit 0
log_dest stdout
connection_messages true

listener 1883 127.0.0.1
protocol mqtt

listener 9001 0.0.0.0
protocol websockets
websockets_log_level 0
