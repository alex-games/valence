[package]
name = "minecraft-server"
version = "1.0.0"
edition = "2021"
description = "Torrance beginner level: single-binary HTTP + WebSocket game server for the Minecraft VM."
license = "MIT"

[workspace]

[dependencies]
postgres = "0.19"
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
rumqttc = { version = "0.24", default-features = false }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
ripemd = "0.1"
bs58 = "0.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
