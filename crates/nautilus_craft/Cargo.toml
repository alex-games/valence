[package]
name = "nautilus_craft"
version.workspace = true
edition.workspace = true
description = "Torrance: the Valence-backed Minecraft server with an embedded voice gameAssistant."
license.workspace = true
repository.workspace = true
documentation.workspace = true

[[bin]]
name = "nautilus-craft"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
valence = { path = "../.." }
postgres = { version = "0.19", features = ["with-serde_json-1"] }
sha2 = "0.10"
rumqttc = { version = "0.24", default-features = false, optional = true }

[features]
default = []
# The MQTT v5 control plane. It is optional so a solo/offline build stays a
# single static binary with no broker dependency.
c2 = ["dep:rumqttc"]
